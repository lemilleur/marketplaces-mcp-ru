# Wildberries analytical workflows — curated recipes over the catalog.
# WB endpoints live-verified 2026-06-23 (stats sales/stocks/orders, prices,
# feedbacks, questions). Field names below are grounded in real responses.

workflows:
  - name: sales_pulse
    category: analytics
    when_to_use: See recent sales, orders and returns to gauge momentum.
    steps:
      - operation_id: wb_order_feed
        why: Current orders, buyouts and returns. Last 31 days, full RFC3339 dates.
    interpret: >
      Page with offset and a stable snapshotTime. Filter current status carefully;
      the period is current-status time, not necessarily order-creation time.
      Legacy Statistics may return empty data despite real orders. For financial
      reconciliation use wb_report_realization, not preliminary operational prices.
    common_mistakes:
      - Hammering the endpoint — 1 req/min limit, expect slow walks.
      - Treating an empty legacy Statistics response as proof of zero sales.
      - Treating current statuses as a complete historical event log.

  - name: stock_health
    category: warehouse
    when_to_use: Check current stock and warehouse remains to avoid stockouts.
    steps:
      - operation_id: wb_post_api_analytics_stocks_report_wb_warehouses
        why: Current stock snapshot (no history).
      - operation_id: wb_analytics_warehouse_remains
        why: Detailed warehouse-remains report (async — returns a task_id to poll).
    interpret: >
      Current Analytics stocks are a point-in-time snapshot; there is no history, so store
      snapshots yourself for trends. The remains report is async: create it, poll
      status, then download.
    common_mistakes:
      - Expecting stock history from the snapshot endpoint.

  - name: price_audit
    category: pricing
    when_to_use: Review current prices and discounts across the catalog.
    steps:
      - operation_id: wb_prices_list
        why: Products with current price and discount (offset pagination).
    interpret: >
      Check for products in price quarantine (a new price 3x below the old one
      triggers it). Use wb_fetch_all for the full list.
    common_mistakes:
      - Setting a price 3x below the old one — it lands in quarantine, not live.

  - name: reorder_planner
    category: warehouse
    when_to_use: Estimate resupply needs from realized sales and current stock.
    steps:
      - operation_id: wb_report_realization
        why: Realized sales by nmId; select actual sales and returns, not fee rows.
      - operation_id: wb_post_api_analytics_stocks_report_wb_warehouses
        why: Current Analytics stock snapshot.
    interpret: >
      Select matching sale dates and net sale/return quantities. Divide by days
      to estimate demand, then compare with sellable inventory. Realization data
      arrives by report period and is not a live order feed. Report missing or
      partial periods explicitly. Do not use empty legacy Statistics as zero demand.
    common_mistakes:
      - Counting storage or delivery rows as sold units.
      - Treating unavailable report days as zero sales.

  - name: abc_analysis
    category: analytics
    when_to_use: Rank products by realized financial revenue.
    steps:
      - operation_id: wb_report_realization
        why: Current Finance rows with nmId, retailAmount, forPay and spp.
    interpret: >
      Fetch every rrdId page until HTTP 204. Select actual sales/returns and a
      consistent revenue metric. Money fields are decimal strings; use Decimal.
      Keep fees separate and do not sum forPay with retailAmount. Rank cumulative
      revenue shares for A/B/C. State the chosen metric, dates and completeness.
    common_mistakes:
      - Mixing gross revenue with net payout or counting fee rows as sales.
      - Parsing money strings with binary floating point.

  - name: reviews_pulse
    category: communications
    when_to_use: Triage customer feedback and unanswered questions.
    steps:
      - operation_id: wb_get_api_feedbacks
        why: Feedbacks; filter isAnswered=false to find what needs a reply.
      - operation_id: wb_get_api_questions
        why: Buyer questions; unanswered ones hurt conversion if left hanging.
    interpret: >
      Both take isAnswered (bool), take (<=5000) and skip for paging. Prioritise
      unanswered + low-star feedbacks. Cluster recurring complaints by nmId — a
      repeated theme on one card is a product/content fix, not a one-off reply.
    common_mistakes:
      - Forgetting take/skip — the endpoints page, default window is small.
