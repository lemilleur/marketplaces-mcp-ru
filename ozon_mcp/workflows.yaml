# Ozon analytical workflows — curated recipes over the catalog.
# Step operation_ids reference ozon_mcp/endpoints.yaml. Interpretation notes are
# grounded in real response fields observed live (price_indexes, commissions, idc).

workflows:
  - name: oos_risk_analysis
    category: analytics
    when_to_use: Find products about to run out of stock so you can resupply in time.
    steps:
      - operation_id: ozon_turnover_stocks
        why: Gives days-of-stock (idc) and ads (avg daily sales) per SKU.
      - operation_id: ozon_stocks_info
        why: Cross-check current available/reserved quantity per product.
    interpret: >
      Each row has idc (days of stock), ads (avg daily sales), idc_grade and
      turnover_grade (live values use the GRADES_* enum: GRADES_GREEN/ YELLOW/
      RED/ CRITICAL). Flag SKUs where turnover_grade is GRADES_CRITICAL/RED or
      idc is very low. Sort by idc ascending — lowest first.
    common_mistakes:
      - Treating reserved stock as available — subtract reserved from present.
      - Ignoring FBO vs FBS split; resupply path differs.

  - name: pricing_analysis
    category: pricing
    when_to_use: Find products with a non-competitive price index (red marker).
    steps:
      - operation_id: ozon_prices_get
        why: Returns price, marketing_seller_price, min_price, commissions and price_indexes.
    interpret: >
      Inspect price_indexes.color_index per item. RED/red means your price is
      above the market reference — candidate for a cut. Compare against
      marketing_seller_price (the buyer-facing price), NOT the base price.
      Use commissions.* to check margin before cutting.
    common_mistakes:
      - Comparing to base price instead of marketing_seller_price.
      - Cutting below min_price or below commission-adjusted break-even.

  - name: unit_economics
    category: finance
    when_to_use: Understand real per-order profitability after Ozon fees.
    steps:
      - operation_id: ozon_finance_transactions
        why: Current raw accruals, one day per request, paginated by last_id (accruals array).
      - operation_id: ozon_finance_accrual_types
        why: Resolve fee type names before categorizing or aggregating amounts.
      - operation_id: ozon_prices_get
        why: Per-SKU commission percentages and current prices.
    interpret: >
      Collect each day and every last_id page in the requested period. Preserve
      signed decimal amounts and do not double-count total_amount and components.
      The retired v3 transaction schema and precomputed totals no longer apply.
      Keep unknown fee categories explicit instead of inventing a classification.
    common_mistakes:
      - Sending the retired filter/page/page_size request instead of date/last_id.
      - Forgetting returns and storage fees in the net.

  - name: catalog_sync
    category: catalog
    when_to_use: Take a full snapshot of your catalog with stock and price.
    steps:
      - operation_id: ozon_product_list
        why: All product_ids/offer_ids (use ozon_fetch_all — last_id pagination).
      - operation_id: ozon_stocks_info
        why: Stock per product (use ozon_fetch_all — cursor pagination).
      - operation_id: ozon_prices_get
        why: Price + commissions per product (use ozon_fetch_all — cursor pagination).
    interpret: >
      Join the three by product_id/offer_id. ozon_fetch_all handles each
      pagination style automatically (last_id for the list, cursor for stocks/prices).
    common_mistakes:
      - Reading only the first page — use ozon_fetch_all, not a single call.

  - name: content_quality_audit
    category: content
    when_to_use: Find cards with low content rating and what to improve.
    steps:
      - operation_id: ozon_product_list
        why: Get SKUs to audit.
      - operation_id: ozon_product_rating
        why: Per-SKU content rating + the attributes that would raise it.
    interpret: >
      A higher content rating improves search ranking. Prioritise SKUs with the
      lowest rating and fill the listed improve_attributes first.
    common_mistakes:
      - Auditing archived products — filter visibility to VISIBLE/IN_SALE.

  - name: abc_analysis
    category: analytics
    when_to_use: Rank SKUs A/B/C by revenue to focus stock and ad budget.
    steps:
      - operation_id: ozon_analytics_data
        why: Revenue and ordered units per SKU over a period (offset pagination).
    interpret: >
      Request metrics ["revenue","ordered_units"] with dimension ["sku"]. Sum
      revenue per sku, sort descending, take cumulative share: A = top 80%,
      B = next 15%, C = last 5%. Window is capped — pull one period at a time.
    common_mistakes:
      - Asking for more metrics/dimensions than the report allows in one call.
      - Ranking by ordered_units instead of revenue.

  - name: reviews_pulse
    category: communications
    when_to_use: Track review sentiment and seller rating trend.
    steps:
      - operation_id: ozon_list_9
        why: Review list (filter by status/rating) — requires the reviews subscription.
      - operation_id: ozon_get_seller_rating_info_for_period
        why: Seller rating dynamics over a period to see if sentiment is moving.
    interpret: >
      Filter reviews by low rating first; cluster recurring complaints per SKU.
      The rating-for-period endpoint shows trend — a falling rating with rising
      low-star reviews is an early churn signal. Review endpoints need the paid
      reviews subscription (Premium Plus); expect 403 without it.
    common_mistakes:
      - Assuming review access without the subscription — handle 403 gracefully.

  - name: sales_swing_diagnosis
    category: analytics
    when_to_use: Orders jump between busy and quiet days and you need to know why.
    steps:
      - operation_id: ozon_analytics_data
        why: ordered_units and revenue by sku and day; revenue/units gives the price actually paid.
      - operation_id: ozon_prices_get
        why: price, marketing_seller_price, min_price and active marketing_actions right now.
      - operation_id: ozon_post_v1_analytics_product_queries_details
        why: Search queries, position and impressions per SKU — the traffic side.
      - operation_id: ozon_post_v1_analytics_stocks
        why: Stock per cluster; an empty cluster lengthens delivery and cuts conversion.
    interpret: >
      First check whether the swing is noise: at an average of λ orders a day,
      a Poisson day below λ−2√λ or above λ+2√λ is still expected once in a
      while; worry about several low days in a row, not one. Then split orders
      into ad-attributed (ozon_perf_get_daily_stats, click-date attribution)
      and the rest. Compare the price actually paid per day (revenue/units)
      with ozon_get_history kind=prices: with auto_action_enabled the buyer
      price moves inside the min_price corridor without any seller action.
      Traffic drop (fewer impressions, worse position) and conversion drop
      (same traffic, fewer orders: price, delivery time, reviews) have
      different fixes. The funnel metrics of /v1/analytics/data are retired.
    common_mistakes:
      - Requesting hits_view_*, session_view, hits_tocart or conv_tocart — retired, rejected.
      - Comparing per-day ad orders with per-day seller orders — attribution dates differ.
      - Reading one quiet day as a trend on a catalogue with single-digit daily orders.
